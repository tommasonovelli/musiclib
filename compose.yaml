# Vibrance MusicLib: production Compose file.
# PostgreSQL and the app, from the published image. See docs/operations.md.
#
#   mkdir -p import             the read-only /import; Compose does not create it
#   docker compose up -d --wait
#
# Settings go in .env next to this file (see .env.example); every one has a
# default. Change the database password before the first start: see below.
#
# Development, tests and building the app from source: compose.dev.yaml
# (docs/docker.md). Both files are the Compose project `musiclib` with the
# same volumes, so an installation can switch from one to the other.
#
# Every image is pinned: PostgreSQL by version and digest,
# the app by its release version. To upgrade, change the app image's version
# below (or download the compose.yaml of the new release): it is the only
# place that names it.

name: musiclib

# The database password, defined here once for both services.
# DEFAULT PASSWORD: `musiclib`. Better change it BEFORE THE FIRST START:
# set POSTGRES_PASSWORD in .env (the README's install block writes a random
# one there), or replace `musiclib` below; .env wins when it sets one, and
# survives an upgrade that replaces this file.
# PostgreSQL reads it only when it creates its database, at the first start:
# changing it later does not change the database's password, and the app can
# no longer connect (docs/operations.md, "First start", explains how to change
# it). The database publishes no port: other machines cannot reach it.
x-db-password: &db-password ${POSTGRES_PASSWORD:-musiclib}

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17.11-trixie@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    # `musiclib-db`: Compose sets COMPOSE_PROJECT_NAME to the project's name,
    # so another project, such as the restore project in docs/operations.md,
    # gets its own names.
    container_name: ${COMPOSE_PROJECT_NAME:-musiclib}-db
    <<: *hardening
    # The entrypoint starts as root, chowns PGDATA and drops to `postgres`
    # with gosu: these are the only capabilities it needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # Durability: these three stay on. They are the defaults; setting
    # them explicitly makes the requirement visible and overrides any stray
    # postgresql.conf / ALTER SYSTEM.
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
      - -c
      - synchronous_commit=on
    # No published port: the app uses the Compose network;
    # for a psql session use `docker compose exec postgres psql -U musiclib`.
    healthcheck:
      # TCP on 127.0.0.1, not the Unix socket: during first initialization
      # the entrypoint runs a temporary server on the socket only, which must
      # not be reported as healthy.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--port=5432", "--username=musiclib", "--dbname=musiclib"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 1s
    # The image stops with SIGINT (fast shutdown); leave time for the final
    # checkpoint instead of SIGKILL after the default 10s.
    stop_grace_period: 60s
    restart: unless-stopped
    environment:
      POSTGRES_USER: musiclib
      POSTGRES_DB: musiclib
      # x-db-password above. Read only when the db volume is first
      # initialized.
      POSTGRES_PASSWORD: *db-password
    volumes:
      - db:/var/lib/postgresql/data

  # -------------------------------------------------------------------------
  # The application.
  app:
    image: ghcr.io/tommasonovelli/musiclib:1.0.0
    # `musiclib`, or the project's name, as for postgres.
    container_name: ${COMPOSE_PROJECT_NAME:-musiclib}
    init: true
    restart: unless-stopped
    # The image runs as 1000:1000 and a new named volume is created owned by
    # it. Another uid needs MUSICLIB_DATA and MUSICLIB_BACKUP as host
    # directories owned by that uid (docs/operations.md).
    user: "${MUSICLIB_UID:-1000}:${MUSICLIB_GID:-1000}"
    <<: *hardening
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # No password in the URL: the PostgreSQL client reads it from
      # PGPASSWORD (x-db-password above), so it need not be URL-safe.
      DATABASE_URL: postgres://musiclib@postgres:5432/musiclib?sslmode=disable
      PGPASSWORD: *db-password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:${MUSICLIB_PORT:-8080}}
      HTTP_ADDR: ":8080"
      # Empty means the default: max(1, min(4, CPUs)).
      WORKERS: ${WORKERS:-}
    ports:
      # Loopback by default; LAN access needs an explicit
      # MUSICLIB_BIND (and a matching PUBLIC_ORIGIN).
      - "${MUSICLIB_BIND:-127.0.0.1}:${MUSICLIB_PORT:-8080}:8080"
    volumes:
      # /data must be local ext4. MUSICLIB_DATA may be a named
      # volume (default) or an absolute host path on ext4 owned by MUSICLIB_UID.
      - ${MUSICLIB_DATA:-data}:/data
      # Backups are not inside /data. Prefer an external ext4 disk mounted
      # through MUSICLIB_BACKUP; the default is a separate named volume.
      - ${MUSICLIB_BACKUP:-backup}:/backup
      - type: bind
        source: ${MUSICLIB_IMPORT:-./import}
        target: /import
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    # A publication already under way gets up to 30 s to finish.
    stop_grace_period: 45s
    # The slim image has no curl: the subcommand queries /health/ready on
    # HTTP_ADDR and exits 0 or 1. It takes no lock and starts nothing.
    # start_period covers the boot: waiting for PostgreSQL, migrations and
    # the volume checks.
    healthcheck:
      test: ["CMD", "/usr/local/bin/musiclibd", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 1s

volumes:
  db:
  data:
  backup:
