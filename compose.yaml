# Vibrance MusicLib: production Compose file (DESIGN.md §2.1, §11.1).
# PostgreSQL and the app, from the published image. See docs/operations.md.
#
#   cp .env.example .env        then set POSTGRES_PASSWORD (openssl rand -hex 32)
#   mkdir -p import             the read-only /import; Compose does not create it
#   docker compose up -d --wait
#
# Development, tests and building the app from source: compose.dev.yaml
# (docs/docker.md). Both files are the Compose project `musiclib` with the
# same volumes, so an installation can switch from one to the other.
#
# Every image is pinned (DESIGN.md §2.1): PostgreSQL by version and digest,
# the app by its release version. To upgrade, change the app image's version
# below (or download the compose.yaml of the new release): it is the only
# place that names it.

name: musiclib

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17.11-trixie@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    <<: *hardening
    # The entrypoint starts as root, chowns PGDATA and drops to `postgres`
    # with gosu: these are the only capabilities it needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # DESIGN.md §11.1: these three stay on. They are the defaults; setting
    # them explicitly makes the requirement visible and overrides any stray
    # postgresql.conf / ALTER SYSTEM.
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
      - -c
      - synchronous_commit=on
    # No published port (DESIGN.md §10.4): the app uses the Compose network;
    # for a psql session use `docker compose exec postgres psql -U musiclib`.
    healthcheck:
      # TCP on 127.0.0.1, not the Unix socket: during first initialization
      # the entrypoint runs a temporary server on the socket only, which must
      # not be reported as healthy.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--port=5432", "--username=musiclib", "--dbname=musiclib"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 1s
    # The image stops with SIGINT (fast shutdown); leave time for the final
    # checkpoint instead of SIGKILL after the default 10s.
    stop_grace_period: 60s
    restart: unless-stopped
    environment:
      POSTGRES_USER: musiclib
      POSTGRES_DB: musiclib
      # Required, no default. Read only when the pgdata volume is first
      # initialized: changing it later does not change the database's
      # password. URL-safe (it goes into DATABASE_URL below).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env next to compose.yaml, e.g. the output of openssl rand -hex 32 (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data

  # -------------------------------------------------------------------------
  # The application (DESIGN.md §11.1).
  app:
    image: ghcr.io/tommasonovelli/musiclib:1.0.0
    init: true
    restart: unless-stopped
    # The image runs as 1000:1000 and a new named volume is created owned by
    # it. Another uid needs MUSICLIB_DATA and MUSICLIB_BACKUP as host
    # directories owned by that uid (docs/operations.md).
    user: "${MUSICLIB_UID:-1000}:${MUSICLIB_GID:-1000}"
    <<: *hardening
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: postgres://musiclib:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env next to compose.yaml, e.g. the output of openssl rand -hex 32 (see .env.example)}@postgres:5432/musiclib?sslmode=disable
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:${MUSICLIB_PORT:-8080}}
      HTTP_ADDR: ":8080"
      # Empty means the default of DESIGN.md §6.1: max(1, min(4, CPUs)).
      WORKERS: ${WORKERS:-}
    ports:
      # DESIGN.md §10.4: loopback by default; LAN access needs an explicit
      # MUSICLIB_BIND (and a matching PUBLIC_ORIGIN).
      - "${MUSICLIB_BIND:-127.0.0.1}:${MUSICLIB_PORT:-8080}:8080"
    volumes:
      # /data must be ext4 (DESIGN.md §3.1). MUSICLIB_DATA may be a named
      # volume (default) or an absolute host path on ext4 owned by MUSICLIB_UID.
      - ${MUSICLIB_DATA:-musiclib-data}:/data
      # Backups are not inside /data. Prefer an external ext4 disk mounted
      # through MUSICLIB_BACKUP; the default is a separate named volume.
      - ${MUSICLIB_BACKUP:-musiclib-backup}:/backup
      - type: bind
        source: ${MUSICLIB_IMPORT:-./import}
        target: /import
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    # DESIGN.md §11.1: a prepared publication gets up to 30 s to finish.
    stop_grace_period: 45s
    # The slim image has no curl: the subcommand queries /health/ready on
    # HTTP_ADDR and exits 0 or 1 (N-027). It takes no lock and starts nothing.
    # start_period covers the boot: waiting for PostgreSQL, migrations and
    # the volume checks (DESIGN.md §11.1).
    healthcheck:
      test: ["CMD", "/usr/local/bin/musiclibd", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 1s

volumes:
  pgdata:
  musiclib-data:
  musiclib-backup:
