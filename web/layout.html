{{define "layout"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{.Title}} — musiclib</title><link rel="stylesheet" href="/static/app.css"><script type="module" src="/static/app.js"></script>{{if .Queue}}<script type="module" src="/static/queue.js"></script>{{end}}</head>
<body><a class="skip-link" href="#main">Skip to content</a>
<header class="topbar"><div class="topbar-inner"><a href="/" class="brand"><span class="brand-mark" aria-hidden="true"></span>musiclib</a><nav aria-label="Main navigation" class="mainnav"><a href="/">Library</a>{{if .AlbumLink}}<a href="{{.AlbumLink}}">Album</a>{{else}}<span aria-disabled="true">Album <span class="nav-note">(select an album)</span></span>{{end}}<a href="/import">Import</a><a href="/activity">Activity <span id="nav-active" hidden aria-label="work in progress">●</span></a></nav></div></header>
<main id="main" class="page"><h1 class="page-title">{{.Title}}</h1>{{template "body" .}}</main></body></html>{{end}}
