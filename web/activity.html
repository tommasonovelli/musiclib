{{define "body"}}<p class="help">Pending, running and failed work. Failed jobs do not retry automatically.</p>
<div id="error" class="notice" role="alert" tabindex="-1" hidden></div>
<div class="toolbar"><p id="activity-state" class="statusline" role="status"></p><div class="toolbar-actions"><button id="retry-failed" class="btn" type="button">Retry failed</button><button id="render-all" class="btn btn-primary" type="button">Render all</button></div></div>
<ul id="jobs" class="joblist"></ul>
<noscript><p class="notice notice-info">JavaScript is required to retry jobs and view live activity.</p></noscript>{{end}}
